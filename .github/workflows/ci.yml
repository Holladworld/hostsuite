name: HostSuite CI

on:
  push:
    branches:
      - chore/next-cloudflare-upgrade
  pull_request:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostsuite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time placeholders only. Never use these for a deployed environment.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Next.js application
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
